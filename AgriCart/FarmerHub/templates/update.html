{% extends 'base.html' %}
{% block content %}

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger text-center alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>Update Product</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{%url 'index' %}">Shop</a></li>
                        <li class="breadcrumb-item active">Update Product</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3 class="text-center mb-4">Add Product</h3>
                <form action="{% url 'edit' edit.id %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-group mb-3">
                        <label for="name">Product Name</label>
                        <input type="text" class="form-control" id="name"  name="name" required value="{{edit.product_name}}">
                    </div>

                    <div class="form-group mb-3">
                        <label for="description">Product Description</label>
                        <textarea class="form-control" id="description"  name="description" rows="3"  required >{{edit.product_description}}</textarea>
                    </div>

                    <div class="form-group mb-3">
                        <label for="category">Product category</label>
                        <select name="category" class="form-control" id="category"  required value="{{edit.category}}">
                            <option value="">--Select product category--</option>
                            {% for i in key %}
                                <option value="{{ i.id }}" {% if i.id == edit.category.id %}selected{% endif %}>{{ i.category }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label for="price">Price (₹)</label>
                        <input type="number" class="form-control" id="price" name="price"   required value="{{edit.price}}">
                    </div>

                    <div class="form-group mb-3">
                        <label for="quantity">Quantity (Kg)</label>
                        <input type="number" class="form-control" id="quantity"  name="quantity"  required value="{{edit.quantity}}">
                    </div>

                    <div class="form-group mb-3">
                        <label for="image">Product Image</label>
                        <input type="file" class="form-control" id="image"  name="image" required value="{{edit.product_image}}">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-black">Update Product</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<br><br>

{% endblock %}
