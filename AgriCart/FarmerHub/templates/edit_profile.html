{% extends 'base.html' %}
{% block content %}
<style>
    .profile-form {
    max-width: 500px;
    margin-top: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.btn-save {
    background: #28a745;
    color: white;
    padding: 10px 15px;
    border-radius: 6px;
    border: none;
}

.btn-save:hover {
    background: #218838;
}
</style>


<div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>EDIT PROFILE</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{%url 'index' %}">Home</a></li>
                        <li class="breadcrumb-item active">Edit Profile</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

<div class="container mt-4">
    <h2><i class="fa fa-user"></i> Edit Profile</h2>

    <form method="POST" class="profile-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ profile.name }}" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" value="{{ profile.email }}" disabled>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ profile.phone }}">
        </div>

        

        <button type="submit" class="btn-save">
            <i class="fa fa-save"></i> Save Changes
        </button>

    </form>
    <br><br><br>
</div>

{% endblock %}
