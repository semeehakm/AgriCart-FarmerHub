{% extends 'base.html' %}
{% block content %}

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger text-center alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>Add Product</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{%url 'index' %}">Shop</a></li>
                        <li class="breadcrumb-item active">Add Product</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3 class="text-center mb-4">Add Product</h3>
                <form action="{% url 'add_product' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-group mb-3">
                        <label for="name">Product Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter product name" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="description">Product Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Enter product description" required></textarea>
                    </div>

                    <div class="form-group mb-3">
                        <label for="category">Product category</label>
                        <select name="category" class="form-control" id="category" required>
                            <option value="">--Select product category--</option>
                            {% for i in key %}
                                <option value="{{ i.id }}">{{ i.category }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label for="price">Price (₹)</label>
                        <input type="number" class="form-control" id="price" name="price" placeholder="Enter product price" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="quantity">Quantity (Kg)</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" placeholder="Enter quantity" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="image">Product Image</label>
                        <input type="file" class="form-control" id="image" name="image" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Add Product</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<br><br>

{% endblock %}
