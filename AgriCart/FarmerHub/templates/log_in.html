{% extends 'base.html' %}
{% load static %}
{% block content %}

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger text-center alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>Login</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{%url 'index' %}">Shop</a></li>
                        <li class="breadcrumb-item active">Login</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->

<!-- Start Login Page  -->
<div class="cart-box-main">
    <div class="container">
        <div class="row justify-content-center">
            <div class="row new-account-login">
                
                <div class="col-sm-12 col-lg-12 mb-3">
                    <div class="title-left">
                        <h3>Login</h3>
                    </div>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="form-row">
                            <div class="col-md-12 mb-3">
                                <label>Email Address *</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                            </div>

                            <div class="col-md-12 mb-3">
                                <label>Password *</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button class="btn btn-outline-custom" type="submit">Login</button>

                        <div class="mt-3">
                            <p>Don't have an account? 
                                <a href="{% url 'buy_reg' %}">Register here</a>
                            </p>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
<!-- End Login Page -->

{% endblock %}
